# Incrementar version al cambiar textos u opciones predeterminados.
version: 2
# /customdungeon reload recarga dungeons, mobs y messages.yml. Los cambios en este archivo (base de datos, límites, valores por defecto, alias) requieren reiniciar el servidor.
prefix: '&8[&6CustomDungeons&8] '
language: es
database:
  type: sqlite
  host: localhost
  port: 3306
  database: customdungeons
  user: customdungeons
  password: ''
  pool-size: 4
dungeon-world:
  name: dungeons
  auto-create: false
dungeon-defaults:
  lives: 3
  keep-inventory: false
  lobby-countdown-seconds: 30
  cooldown-seconds: 0
  min-players: 1
  max-players: 0
  scaling:
    extra-mobs-per-player: 0.25
    extra-health-per-player: 0.15
performance:
  max-alive-mobs-per-session: 50
  particle-density: 1.0
  effect-view-radius: 48.0
armor-capable-mobs:
  - zombie
  - husk
  - drowned
  - zombie_villager
  - skeleton
  - stray
  - wither_skeleton
  - bogged
  - parched
  - piglin
  - piglin_brute
  - zombified_piglin
command-aliases: []
gui-sounds:
  click: minecraft:ui.button.click
  open: minecraft:block.chest.open
  save: minecraft:entity.player.levelup
  error: minecraft:block.note_block.bass
door-material: IRON_BLOCK
live-test:
  max-seconds: 300
# Missing sound keys default to 2400 ticks in BossController (T06).
# Example entry:
#   - key: minecraft:music_disc.cat
#     ticks: 3700
music-lengths: []
updater:
  enabled: true
  check-on-startup: true
  repository: Dasannn/CustomDungeons
  # Solo HTTPS; permite probar contra una API local con certificado de confianza.
  api-base-url: https://api.github.com/

tools:
  # Materiales inertes admitidos: BLAZE_ROD, AMETHYST_SHARD, BREEZE_ROD,
  # ECHO_SHARD, STICK, PAPER, FEATHER, FLINT, QUARTZ, PRISMARINE_SHARD,
  # PRISMARINE_CRYSTALS y BONE. Otros valores usan el default de su tipo.
  # Aplica los cambios con /customdungeon reload; pide la herramienta de nuevo para actualizarla.
  items:
    region: BLAZE_ROD
    door: AMETHYST_SHARD
    spawner: BREEZE_ROD
    point: ECHO_SHARD
